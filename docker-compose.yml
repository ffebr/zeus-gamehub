name: zeus

services:
  redis-master:
    image: redis:7-alpine
    command:
      - redis-server
      - --port
      - "6379"
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --auto-aof-rewrite-percentage
      - "100"
      - --save
      - "3600"
      - "1"
      - --save
      - "300"
      - "100"
      - --save
      - "60"
      - "10000"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-lru
      - --min-replicas-to-write
      - "1"
      - --min-replicas-max-lag
      - "10"
    ports:
      - "6379:6379"
    volumes:
      - redis-master-data:/data
    networks:
      internal:
        ipv4_address: 172.30.80.10
        aliases:
          - redis-master
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20

  redis-replica-1:
    image: redis:7-alpine
    command:
      - redis-server
      - --port
      - "6379"
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --auto-aof-rewrite-percentage
      - "100"
      - --save
      - "3600"
      - "1"
      - "300"
      - "100"
      - "60"
      - "10000"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-lru
      - --replicaof
      - redis-master
      - "6379"
      - --replica-read-only
      - "yes"
      - --min-replicas-to-write
      - "1"
      - --min-replicas-max-lag
      - "10"
      - --replica-announce-ip
      - 172.30.80.11
      - --replica-announce-port
      - "6379"
    ports:
      - "6380:6379"
    volumes:
      - redis-replica-1-data:/data
    networks:
      internal:
        ipv4_address: 172.30.80.11
    depends_on:
      redis-master:
        condition: service_healthy

  redis-replica-2:
    image: redis:7-alpine
    command:
      - redis-server
      - --port
      - "6379"
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --auto-aof-rewrite-percentage
      - "100"
      - --save
      - "3600"
      - "1"
      - "300"
      - "100"
      - "60"
      - "10000"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-lru
      - --replicaof
      - redis-master
      - "6379"
      - --replica-read-only
      - "yes"
      - --min-replicas-to-write
      - "1"
      - --min-replicas-max-lag
      - "10"
      - --replica-announce-ip
      - 172.30.80.12
      - --replica-announce-port
      - "6379"
    ports:
      - "6381:6379"
    volumes:
      - redis-replica-2-data:/data
    networks:
      internal:
        ipv4_address: 172.30.80.12
    depends_on:
      redis-master:
        condition: service_healthy

  sentinel-1:
    image: redis:7-alpine
    entrypoint: ["/bin/sh", "/usr/local/bin/sentinel-entrypoint.sh"]
    environment:
      SENTINEL_NAME: sentinel-1
      SENTINEL_PORT: "26379"
    ports:
      - "26379:26379"
    volumes:
      - ./docker/sentinel-entrypoint.sh:/usr/local/bin/sentinel-entrypoint.sh:ro
      - sentinel-1-data:/data
    networks:
      - internal
    depends_on:
      redis-master:
        condition: service_healthy

  sentinel-2:
    image: redis:7-alpine
    entrypoint: ["/bin/sh", "/usr/local/bin/sentinel-entrypoint.sh"]
    environment:
      SENTINEL_NAME: sentinel-2
      SENTINEL_PORT: "26380"
    ports:
      - "26380:26380"
    volumes:
      - ./docker/sentinel-entrypoint.sh:/usr/local/bin/sentinel-entrypoint.sh:ro
      - sentinel-2-data:/data
    networks:
      - internal
    depends_on:
      redis-master:
        condition: service_healthy

  sentinel-3:
    image: redis:7-alpine
    entrypoint: ["/bin/sh", "/usr/local/bin/sentinel-entrypoint.sh"]
    environment:
      SENTINEL_NAME: sentinel-3
      SENTINEL_PORT: "26381"
    ports:
      - "26381:26381"
    volumes:
      - ./docker/sentinel-entrypoint.sh:/usr/local/bin/sentinel-entrypoint.sh:ro
      - sentinel-3-data:/data
    networks:
      - internal
    depends_on:
      redis-master:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      JAVA_TOOL_OPTIONS: -Dconfig.file=/workspace/conf/application.conf
    ports:
      - "8080:8080"
    volumes:
      - ./app/src/main/resources/application.conf:/workspace/conf/application.conf:ro
    networks:
      - internal
    depends_on:
      redis-master:
        condition: service_healthy
      sentinel-1:
        condition: service_started
      sentinel-2:
        condition: service_started
      sentinel-3:
        condition: service_started

  redis-insight:
    image: redis/redisinsight:latest
    profiles: ["insight"]
    ports:
      - "5540:5540"
    volumes:
      - redis-insight-data:/data
    networks:
      - internal

networks:
  internal:
    name: zeus-internal
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.80.0/24

volumes:
  redis-master-data:
  redis-replica-1-data:
  redis-replica-2-data:
  sentinel-1-data:
  sentinel-2-data:
  sentinel-3-data:
  redis-insight-data:
